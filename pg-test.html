<!DOCTYPE html>

<title>MCC Counselling Online Test</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#5d6b7c;--ac:#1f6feb;--ok:#1a7f37;--bad:#c62828;--bd:#d8dee6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161c;--card:#1b222b;--tx:#e6ebf1;--mu:#9aa7b6;--ac:#5b9dff;--ok:#4cc26a;--bad:#ff6b6b;--bd:#2d3744;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12161c;--card:#1b222b;--tx:#e6ebf1;--mu:#9aa7b6;--ac:#5b9dff;--ok:#4cc26a;--bad:#ff6b6b;--bd:#2d3744;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:1.25rem;margin:0}h2{font-size:1.1rem;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.q{font-weight:600;margin:0 0 8px}.src{font-size:.78rem;color:var(--mu)}
label{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label:has(input:checked){border-color:var(--ac)}
label.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
label.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
textarea{width:100%;min-height:90px;border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--bg);color:var(--tx);font:inherit;box-sizing:border-box}
.model{display:none;margin-top:8px;padding:10px;border-left:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);font-size:.92rem}
.show .model{display:block}
#res{font-size:1.1rem;font-weight:700}
#timer{font-variant-numeric:tabular-nums;font-weight:700}
</style></head><body><main>
<header class="top"><h1>MCC Counselling Online Test</h1><span id="timer">60:00</span></header>
<p class="src">Based on the NEET-UG 2026, NEET-MDS 2026, NEET-PG 2026 and NEET-SS 2025 MCC information bulletins. Part A: MCQs (1 mark each). Part B: written answers (self-check against model points).</p>
<h2>Part A: Multiple choice</h2><div id="mcq"></div>
<h2>Part B: Written questions</h2><div id="wr"></div>
<div class="card"><button id="sub">Submit test</button> <button class="alt" id="rst">Restart</button><p id="res"></p></div>
</main>

const W=[
["Explain the structure of AIQ counselling rounds for NEET-UG 2026 and how it differs from NEET-SS.","UG AIQ (15%): four rounds - Round 1, Round 2, Round 3 and Stray Vacancy Round. NEET-SS AIQ (50%): only two rounds - Round 1 and Round 2. Round 2 in SS is for registered candidates who got no seat in Round 1."],
["Describe the fee and security deposit structure for UG AIQ, PG/MDS AIQ, Deemed Universities and NEET-SS.","UG AIQ: Rs 1,000 + Rs 10,000 (UR/EWS); Rs 500 + Rs 5,000 (SC/ST/OBC/PwD). PG/MDS AIQ: Rs 1,000 + Rs 25,000 (UR); Rs 500 + Rs 10,000 (SC etc.). Deemed: Rs 5,000 + Rs 2,00,000. SS: Rs 5,000 + Rs 2,00,000. Registration fee is non-refundable; security deposit is refundable."],
["When is a security deposit forfeited and when is it refunded?","Forfeited if an allotted candidate does not join or surrenders the seat, or if admission is cancelled (for example wrong information or missing documents). Refunded only after all rounds of counselling are completed."],

const $=s=>document.querySelector(s);let done=false,t0=3600,tm;
function render(){
 $("#mcq").innerHTML=M.map((m,i)=>`<div class="card" id="c${i}"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join("")}<span class="src">Source: ${m[3]} bulletin</span></div>`).join("");
 $("#wr").innerHTML=W.map((w,i)=>`<div class="card" id="w${i}"><p class="q">W${i+1}. ${w[0]}</p><textarea placeholder="Write your answer"></textarea><div class="model"><b>Model points:</b> ${w[1]}</div></div>`).join("");
 done=false;$("#res").textContent="";t0=3600;clearInterval(tm);tm=setInterval(tick,1000);tick(true);
}
function tick(skip){if(!skip)t0--;const m=String(Math.floor(t0/60)).padStart(2,"0"),s=String(t0%60).padStart(2,"0");$("#timer").textContent=m+":"+s;if(t0<=0&&!done)submit()}
function submit(){
 if(done)return;done=true;clearInterval(tm);let sc=0;
 M.forEach((m,i)=>{const c=$("#c"+i),ls=c.querySelectorAll("label"),sel=c.querySelector("input:checked");
  ls[m[2]].classList.add("ok");if(sel){if(+sel.value===m[2])sc++;else ls[+sel.value].classList.add("bad")}
  c.querySelectorAll("input").forEach(x=>x.disabled=true)});
 document.querySelectorAll("#wr .card").forEach(c=>c.classList.add("show"));
 $("#res").textContent=`MCQ score: ${sc} / ${M.length} (${Math.round(100*sc/M.length)}%). Compare written answers with the model points.`;
 $("#res").scrollIntoView({behavior:"smooth"});
}
$("#sub").onclick=submit;$("#rst").onclick=render;render();
</script></body></html>
