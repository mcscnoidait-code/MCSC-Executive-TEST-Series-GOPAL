<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCC Counselling Online Test</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#5d6b7c;--ac:#1f6feb;--ok:#1a7f37;--bad:#c62828;--bd:#d8dee6;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12161c;--card:#1b222b;--tx:#e6ebf1;--mu:#9aa7b6;--ac:#5b9dff;--ok:#4cc26a;--bad:#ff6b6b;--bd:#2d3744;color-scheme:dark}}
:root[data-theme=dark]{--bg:#12161c;--card:#1b222b;--tx:#e6ebf1;--mu:#9aa7b6;--ac:#5b9dff;--ok:#4cc26a;--bad:#ff6b6b;--bd:#2d3744;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:8px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:1.25rem;margin:0}h2{font-size:1.1rem;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.q{font-weight:600;margin:0 0 8px}.src{font-size:.78rem;color:var(--mu)}
label{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
label:has(input:checked){border-color:var(--ac)}
label.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
label.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
textarea{width:100%;min-height:90px;border:1px solid var(--bd);border-radius:8px;padding:8px;background:var(--bg);color:var(--tx);font:inherit;box-sizing:border-box}
.model{display:none;margin-top:8px;padding:10px;border-left:3px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent);font-size:.92rem}
.show .model{display:block}
#res{font-size:1.1rem;font-weight:700}
#timer{font-variant-numeric:tabular-nums;font-weight:700}
</style></head><body><main>
<header class="top"><h1>MCC Counselling Online Test</h1><span id="timer">60:00</span></header>
<p class="src">Based on the NEET-UG 2026, NEET-MDS 2026, NEET-PG 2026 and NEET-SS 2025 MCC information bulletins. Part A: MCQs (1 mark each). Part B: written answers (self-check against model points).</p>
<h2>Part A: Multiple choice</h2><div id="mcq"></div>
<h2>Part B: Written questions</h2><div id="wr"></div>
<div class="card"><button id="sub">Submit test</button> <button class="alt" id="rst">Restart</button><p id="res"></p></div>
</main>
<script>
// [question, [options], correctIndex, source]
const M=[
["How many rounds of online counselling are held for the 15% All India Quota seats in NEET-UG counselling 2026?",["Two","Three","Four","Five"],2,"UG"],
["Which rounds make up UG AIQ counselling?",["Round 1, Round 2, Mop-up, Final","Round 1, Round 2, Round 3, Stray Vacancy Round","Round 1 and Round 2 only","Round 1, Special Round, Stray Round"],1,"UG"],
["How many rounds of AIQ counselling are conducted for NEET-PG (MD/MS) 2026?",["Two","Three","Four","Six"],2,"PG"],
["How many rounds of AIQ counselling are conducted for NEET-MDS 2026?",["Two","Three","Four","Five"],2,"MDS"],
["How many rounds of SS AIQ online counselling are held for NEET-SS (DM/MCh/DrNB SS)?",["One","Two","Three","Four"],1,"SS"],
["The MCC conducts counselling on behalf of which body?",["NMC","NBEMS","DGHS, MoHFW","UGC"],2,"All"],
["What share of MBBS/BDS seats of participating states is filled through the All India Quota in NEET-UG counselling?",["10%","15%","50%","85%"],1,"UG"],
["What share of PG (MD/MS) seats of contributing states is filled through the All India Quota?",["15%","27%","50%","100%"],2,"PG"],
["Reservation for Scheduled Tribes in AIQ seats is:",["5%","7.5%","10%","15%"],1,"UG/PG/MDS"],
["Reservation for OBC (Non-Creamy Layer) in AIQ seats is:",["10%","15%","22.5%","27%"],3,"UG/PG/MDS"],
["Non-refundable registration fee for an unreserved UG AIQ candidate is:",["Rs 500","Rs 1,000","Rs 5,000","Rs 10,000"],1,"UG"],
["Refundable security deposit for an unreserved/EWS UG AIQ candidate is:",["Rs 5,000","Rs 10,000","Rs 25,000","Rs 2,00,000"],1,"UG"],
["An SC/ST/OBC/PwD candidate registering for UG AIQ pays a total of:",["Rs 5,500","Rs 11,000","Rs 5,000","Rs 10,500"],0,"UG"],
["Registration fee plus refundable security deposit for Deemed Universities (UG) at registration is:",["Rs 5,000 + Rs 2,00,000","Rs 1,000 + Rs 10,000","Rs 5,000 + Rs 25,000","Rs 500 + Rs 5,000"],0,"UG"],
["An unreserved PG/MDS AIQ candidate pays registration fee and security deposit of:",["Rs 1,000 + Rs 25,000","Rs 1,000 + Rs 10,000","Rs 500 + Rs 25,000","Rs 5,000 + Rs 25,000"],0,"PG/MDS"],
["An SC candidate opting for PG/MDS AIQ pays:",["Rs 500 + Rs 10,000","Rs 1,000 + Rs 10,000","Rs 500 + Rs 25,000","Rs 5,000 + Rs 10,000"],0,"PG/MDS"],
["NEET-SS counselling fee structure is:",["Rs 5,000 registration + Rs 2,00,000 refundable security","Rs 1,000 + Rs 25,000","Rs 500 + Rs 10,000","Rs 10,000 total"],0,"SS"],
["What happens to the security deposit if a candidate allotted a seat does not join?",["It is refunded","It is forfeited","It is carried to next year","It is halved"],1,"All"],
["When does the refund process begin?",["After each round","After Round 1 only","After all rounds of counselling are completed","Immediately on request"],2,"All"],
["Which round offers free exit?",["Round 1","Round 2","Round 3","Stray Vacancy Round"],0,"UG/PG/MDS"],
["Candidates who join in Round 3 of AIQ:",["Can resign and join Stray Round","Cannot resign and take part in further rounds","Get their deposit refunded at once","Can upgrade freely"],1,"UG/MDS"],
["Offline resignation of a seat in UG counselling is:",["Permitted","Permitted only in Round 1","Not permitted; resignation is online only","Permitted with a notary"],2,"UG"],
["In NEET-SS counselling, who is eligible for Round 2 allotment?",["Only candidates who joined in Round 1","Registered candidates who got no seat in Round 1","Only in-service candidates","All candidates automatically"],1,"SS"],
["Where must NEET-SS counselling applications be submitted?",["Any state website","By post","Only online on the MCC website","At the institute"],2,"SS"],
["A candidate submitting more than one NEET-SS registration form will be:",["Warned","Charged extra","Debarred and candidature cancelled","Given the better rank"],2,"SS"],
["NRI candidates file an affidavit on stamp paper of value:",["Rs 10","Rs 50","Rs 100","Rs 500"],2,"PG/UG"],
["Of Deemed University seats, what share is allocated to NRI candidates?",["5%","10%","15%","25%"],2,"UG/PG/MDS"],
["Which roster is applied on 50% AIQ seats in PG counselling?",["100-point","200-point","1000-point","3200-point"],3,"PG"],
["Each counselling round is:",["A continuation of the previous round with the same rules","A separate round with its own rules","Optional","Run by the states"],1,"PG/MDS"],
["From a duplicate or excess receipt refund, the custodian deducts:",["Nothing","50% of registration fee or Rs 500, whichever is less","Entire fee","Rs 5,000"],1,"UG"]
];
const W=[
["Explain the structure of AIQ counselling rounds for NEET-UG 2026 and how it differs from NEET-SS.","UG AIQ (15%): four rounds - Round 1, Round 2, Round 3 and Stray Vacancy Round. NEET-SS AIQ (50%): only two rounds - Round 1 and Round 2. Round 2 in SS is for registered candidates who got no seat in Round 1."],
["Describe the fee and security deposit structure for UG AIQ, PG/MDS AIQ, Deemed Universities and NEET-SS.","UG AIQ: Rs 1,000 + Rs 10,000 (UR/EWS); Rs 500 + Rs 5,000 (SC/ST/OBC/PwD). PG/MDS AIQ: Rs 1,000 + Rs 25,000 (UR); Rs 500 + Rs 10,000 (SC etc.). Deemed: Rs 5,000 + Rs 2,00,000. SS: Rs 5,000 + Rs 2,00,000. Registration fee is non-refundable; security deposit is refundable."],
["When is a security deposit forfeited and when is it refunded?","Forfeited if an allotted candidate does not join or surrenders the seat, or if admission is cancelled (for example wrong information or missing documents). Refunded only after all rounds of counselling are completed."],
["What is free exit, and what restriction applies after joining Round 3?","Round 1 offers free exit: a candidate may leave without penalty. Candidates joining in Round 3 cannot resign and cannot take part in further rounds, so the decision to continue must be taken carefully."],
["List the reservation categories and percentages applied to AIQ seats.","SC 15%, ST 7.5%, OBC (Non-Creamy Layer) as per Central OBC list 27%, plus EWS and PwBD as per the roster applied by MCC under DoPT norms. PG uses a 3200-point roster."]
];
const $=s=>document.querySelector(s);let done=false,t0=3600,tm;
function render(){
 $("#mcq").innerHTML=M.map((m,i)=>`<div class="card" id="c${i}"><p class="q">${i+1}. ${m[0]}</p>${m[1].map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${o}</label>`).join("")}<span class="src">Source: ${m[3]} bulletin</span></div>`).join("");
 $("#wr").innerHTML=W.map((w,i)=>`<div class="card" id="w${i}"><p class="q">W${i+1}. ${w[0]}</p><textarea placeholder="Write your answer"></textarea><div class="model"><b>Model points:</b> ${w[1]}</div></div>`).join("");
 done=false;$("#res").textContent="";t0=3600;clearInterval(tm);tm=setInterval(tick,1000);tick(true);
}
function tick(skip){if(!skip)t0--;const m=String(Math.floor(t0/60)).padStart(2,"0"),s=String(t0%60).padStart(2,"0");$("#timer").textContent=m+":"+s;if(t0<=0&&!done)submit()}
function submit(){
 if(done)return;done=true;clearInterval(tm);let sc=0;
 M.forEach((m,i)=>{const c=$("#c"+i),ls=c.querySelectorAll("label"),sel=c.querySelector("input:checked");
  ls[m[2]].classList.add("ok");if(sel){if(+sel.value===m[2])sc++;else ls[+sel.value].classList.add("bad")}
  c.querySelectorAll("input").forEach(x=>x.disabled=true)});
 document.querySelectorAll("#wr .card").forEach(c=>c.classList.add("show"));
 $("#res").textContent=`MCQ score: ${sc} / ${M.length} (${Math.round(100*sc/M.length)}%). Compare written answers with the model points.`;
 $("#res").scrollIntoView({behavior:"smooth"});
}
$("#sub").onclick=submit;$("#rst").onclick=render;render();
</script></body></html>
